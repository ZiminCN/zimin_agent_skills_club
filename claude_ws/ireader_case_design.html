<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body { background:#111; display:flex; flex-direction:column; align-items:center; padding:30px; }

  /* ===== 连续全景画布 ===== */
  .continuous-canvas {
    position:relative;
    width:2100px;   /* 正面1200 + 背面900 */
    height:1600px;
    overflow:hidden;
    background:#0a0a14;
    margin-bottom:40px;
  }

  /* ---- 背景：整片天空渐变 ---- */
  .sky {
    position:absolute; inset:0; z-index:0;
    background: linear-gradient(175deg,
      #0f0c29 0%,
      #1a1542 8%,
      #2d1b4e 15%,
      #302b63 22%,
      #24243e 30%,
      #1a1a3e 40%,
      #16213e 50%,
      #0f3460 60%,
      #1a3a5c 68%,
      #1e4d6e 74%,
      #0c2d48 80%,
      #0a1a2e 90%,
      #060d1a 100%);
  }

  /* 星空粒子 */
  .stars-layer {
    position:absolute; inset:0; z-index:1;
    background-image:
      radial-gradient(1px 1px at 10% 5%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 40% 3%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 55% 6%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 4%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 85% 7%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 15% 12%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 48% 10%, rgba(255,255,255,0.55), transparent),
      radial-gradient(2px 2px at 62% 11%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 78% 9%, rgba(255,255,255,0.45), transparent),
      radial-gradient(2px 2px at 90% 13%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 32% 15%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 8% 18%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 52% 14%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 68% 16%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 95% 5%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1.5px 1.5px at 20% 20%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 44% 18%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 75% 12%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 58% 19%, rgba(255,255,255,0.35), transparent);
  }

  /* ---- 月亮 ---- */
  .moon-container {
    position:absolute; z-index:3;
    top:60px; right:180px;
    width:160px; height:160px;
  }
  .moon-glow-outer {
    position:absolute;
    top:-40px; left:-40px;
    width:240px; height:240px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,220,160,0.12) 0%, rgba(255,180,80,0.05) 40%, transparent 70%);
  }
  .moon-glow-inner {
    position:absolute;
    top:-10px; left:-10px;
    width:180px; height:180px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,210,0.15) 0%, transparent 60%);
  }
  .moon-body {
    position:absolute;
    top:0; left:0;
    width:160px; height:160px;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%,
      #fffef5 0%, #fef9e7 8%, #fef3c7 18%,
      #fde68a 30%, #fcd34d 45%, #f59e0b 62%,
      #d97706 78%, #b45309 90%, #78350f 100%);
    box-shadow:
      0 0 30px rgba(255,200,100,0.3),
      0 0 80px rgba(255,180,60,0.15),
      0 0 150px rgba(255,150,30,0.08);
  }
  .moon-crater-1 {
    position:absolute; top:35px; left:55px;
    width:22px; height:22px; border-radius:50%;
    background:rgba(180,130,80,0.2);
  }
  .moon-crater-2 {
    position:absolute; top:80px; left:90px;
    width:14px; height:14px; border-radius:50%;
    background:rgba(170,120,70,0.18);
  }
  .moon-crater-3 {
    position:absolute; top:95px; left:40px;
    width:18px; height:18px; border-radius:50%;
    background:rgba(160,110,60,0.15);
  }

  /* ---- 水面 ---- */
  .water-container {
    position:absolute;
    bottom:0; left:0; right:0;
    height:420px;
    z-index:4;
    overflow:hidden;
  }
  .water-base {
    position:absolute; bottom:0; left:0; right:0;
    height:420px;
    background: linear-gradient(to bottom,
      rgba(15,30,60,0.3) 0%,
      rgba(8,20,45,0.7) 25%,
      rgba(5,15,40,0.9) 50%,
      rgba(3,10,30,0.98) 100%);
  }
  /* 月光倒影 */
  .moon-reflection {
    position:absolute;
    bottom:30px;
    right:190px;
    width:60px;
    height:280px;
    background: linear-gradient(to bottom,
      rgba(255,220,140,0.35) 0%,
      rgba(255,200,100,0.25) 20%,
      rgba(255,180,70,0.15) 50%,
      rgba(255,150,40,0.06) 80%,
      transparent 100%);
    border-radius:0 0 30px 30px;
    filter:blur(6px);
    animation:none;
  }
  .moon-reflection-2 {
    position:absolute;
    bottom:20px;
    right:170px;
    width:80px;
    height:220px;
    background: linear-gradient(to bottom,
      rgba(255,240,180,0.2) 0%,
      rgba(255,210,130,0.12) 30%,
      rgba(255,180,80,0.06) 60%,
      transparent 100%);
    border-radius:0 0 40px 40px;
    filter:blur(10px);
  }
  /* 水面波纹 */
  .water-ripples {
    position:absolute;
    bottom:0; left:0; right:0;
    height:420px;
  }
  .ripple {
    position:absolute;
    height:1px;
    background: linear-gradient(to right, transparent, rgba(180,200,240,0.12), transparent);
  }

  /* ---- 云雾 ---- */
  .clouds-layer { position:absolute; inset:0; z-index:2; }

  .cloud {
    position:absolute;
    border-radius:50%;
    filter:blur(50px);
  }
  .cloud-1 {
    top:280px; left:80px;
    width:350px; height:120px;
    background:rgba(120,100,160,0.18);
  }
  .cloud-2 {
    top:350px; left:600px;
    width:400px; height:100px;
    background:rgba(80,120,180,0.15);
  }
  .cloud-3 {
    top:420px; left:250px;
    width:300px; height:80px;
    background:rgba(100,140,200,0.12);
  }
  .cloud-4 {
    top:200px; left:900px;
    width:280px; height:90px;
    background:rgba(150,120,180,0.13);
  }
  .cloud-5 {
    top:320px; left:1200px;
    width:350px; height:110px;
    background:rgba(100,140,200,0.1);
  }
  .cloud-6 {
    top:450px; left:1400px;
    width:400px; height:100px;
    background:rgba(80,100,160,0.12);
  }
  .cloud-7 {
    top:500px; left:1050px;
    width:320px; height:85px;
    background:rgba(120,130,180,0.09);
  }

  /* ---- 文字内容 ---- */

  /* 正面右上角：知行合一 */
  .zhixingheyi {
    position:absolute; z-index:10;
    top:90px; right:60px;
    font-family:'Ma Shan Zheng', serif;
    font-size:36px;
    color:rgba(255,240,210,0.85);
    letter-spacing:0.25em;
    text-shadow:0 0 20px rgba(255,200,100,0.2);
  }
  .zhixingheyi::after {
    content:'';
    display:block;
    width:60%;
    height:2px;
    margin:8px auto 0;
    background:linear-gradient(to right, transparent, rgba(253,224,71,0.5), transparent);
  }

  /* 正面中心区域：诗句主体 */
  .poem-main {
    position:absolute; z-index:10;
    /* 在正面区域(0-1200px)的核心位置 */
    top:49%;
    left:50%;
    transform:translate(-50%, -50%);
    margin-left:-40px;
    margin-top:-50px;
    text-align:center;
  }
  .poem-main .line {
    font-family:'Noto Serif SC', serif;
    font-size:56px;
    font-weight:900;
    color:#fff;
    letter-spacing:0.18em;
    line-height:1.7;
    text-shadow:
      0 0 40px rgba(255,220,150,0.3),
      0 0 80px rgba(255,180,80,0.15),
      0 2px 4px rgba(0,0,0,0.5);
  }
  .poem-main .line:first-child {
    background: linear-gradient(180deg, #fffef5 0%, #fef3c7 40%, #fcd34d 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .poem-main .line:last-child {
    background: linear-gradient(180deg, #e0f0ff 0%, #93c5fd 50%, #60a5fa 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* 诗句装饰光晕 */
  .poem-glow {
    position:absolute; z-index:9;
    top:49%; left:50%;
    transform:translate(-50%, -50%);
    width:500px; height:250px;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(100,150,220,0.12) 0%, rgba(60,100,180,0.05) 50%, transparent 70%);
    filter:blur(30px);
    margin-left:-40px;
    margin-top:-50px;
  }

  /* 分隔装饰 */
  .ornament {
    position:absolute; z-index:10;
    top:49.5%; left:50%;
    transform:translate(-50%, -50%);
    margin-left:-40px;
    margin-top:75px;
    display:flex; align-items:center; gap:30px;
    opacity:0.6;
  }
  .ornament .diamond {
    width:8px; height:8px;
    background:rgba(180,200,240,0.8);
    transform:rotate(45deg);
    box-shadow:0 0 8px rgba(180,200,240,0.5);
  }
  .ornament .line-sep {
    width:60px; height:1px;
    background:linear-gradient(to right, transparent, rgba(180,200,240,0.5), transparent);
  }

  /* 正面左下角小字：万境归一 */
  .corner-note {
    position:absolute; z-index:10;
    bottom:100px; left:80px;
    font-family:'Ma Shan Zheng', serif;
    font-size:20px;
    color:rgba(180,200,230,0.5);
    letter-spacing:0.2em;
  }

  /* ---- 分界标记：正面/背面交接处 ---- */
  .edge-marker {
    position:absolute;
    left:1200px; top:0; bottom:0;
    width:2px;
    background:linear-gradient(to bottom, transparent 5%, rgba(255,255,255,0.15) 50%, transparent 95%);
    z-index:20;
    pointer-events:none;
  }

  /* ---- 背面：9:16 区域 (1200-2100px) ---- */

  /* 背面 - 繁星更多 */
  .back-stars {
    position:absolute; z-index:6;
    left:1250px; top:0; right:0; bottom:0;
    background-image:
      radial-gradient(2px 2px at 5% 15%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 20% 8%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 35% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 50% 12%, rgba(255,255,255,0.5), transparent),
      radial-gradient(3px 3px at 65% 5%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 80% 18%, rgba(255,255,255,0.55), transparent),
      radial-gradient(2px 2px at 10% 25%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 30% 30%, rgba(255,255,255,0.45), transparent),
      radial-gradient(2px 2px at 55% 22%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 72% 28%, rgba(255,255,255,0.35), transparent),
      radial-gradient(3px 3px at 88% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 42% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(2px 2px at 15% 38%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 68% 32%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 85% 35%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 25% 42%, rgba(255,255,255,0.35), transparent),
      radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 92% 42%, rgba(255,255,255,0.5), transparent),
      radial-gradient(3px 3px at 48% 45%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 75% 48%, rgba(255,255,255,0.35), transparent);
    pointer-events:none;
  }

  /* 背面 - 水面延伸（变成完全抽象的水波纹理） */
  .water-back {
    position:absolute;
    bottom:0; left:1200px; right:0;
    height:380px;
    z-index:5;
    background: linear-gradient(to bottom,
      rgba(5,12,30,0.2) 0%,
      rgba(3,8,25,0.6) 30%,
      rgba(2,6,20,0.95) 100%);
  }
  .water-back-pattern {
    position:absolute;
    bottom:0; left:1200px; right:0;
    height:380px;
    z-index:6;
    opacity:0.12;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 38px,
        rgba(150,180,220,0.15) 38px,
        rgba(150,180,220,0.15) 39px
      ),
      repeating-linear-gradient(
        -5deg,
        transparent,
        transparent 60px,
        rgba(180,200,230,0.1) 60px,
        rgba(180,200,230,0.1) 61px
      );
    pointer-events:none;
  }

  /* 背面云雾渐变 */
  .cloud-back {
    position:absolute;
    bottom:350px; left:1250px; right:50px;
    height:120px;
    z-index:7;
    background: radial-gradient(ellipse 600px 100px at 50% 50%, rgba(80,120,200,0.08), transparent);
    filter:blur(40px);
  }

  /* 背面文字：莫名其妙 */
  .momingqimiao {
    position:absolute; z-index:10;
    right:100px; bottom:300px;
    font-family:'Ma Shan Zheng', serif;
    font-size:44px;
    color:rgba(200,210,240,0.7);
    letter-spacing:0.3em;
    writing-mode:vertical-lr;
    text-shadow:0 0 30px rgba(150,180,220,0.2);
  }
  .momingqimiao::before {
    content:'';
    display:block;
    width:2px;
    height:40px;
    margin:0 auto 20px;
    background:linear-gradient(to bottom, transparent, rgba(180,200,230,0.4));
  }
  .momingqimiao::after {
    content:'';
    display:block;
    width:2px;
    height:40px;
    margin:20px auto 0;
    background:linear-gradient(to bottom, rgba(180,200,230,0.4), transparent);
  }

  /* 背面 - 抽象圆形/波纹（呼应正面的月亮和水的意象） */
  .back-circle-1 {
    position:absolute; z-index:5;
    left:1350px; top:300px;
    width:120px; height:120px;
    border-radius:50%;
    border:1px solid rgba(180,200,230,0.12);
    box-shadow:0 0 40px rgba(150,180,220,0.06);
  }
  .back-circle-2 {
    position:absolute; z-index:5;
    left:1380px; top:330px;
    width:60px; height:60px;
    border-radius:50%;
    border:1px solid rgba(180,200,230,0.08);
  }
  .back-circle-3 {
    position:absolute; z-index:5;
    left:1500px; top:200px;
    width:80px; height:80px;
    border-radius:50%;
    border:1px solid rgba(180,200,230,0.1);
    box-shadow:0 0 30px rgba(150,180,220,0.04);
  }

  /* 背面底部小字：心月同明 */
  .back-note {
    position:absolute; z-index:10;
    bottom:80px; right:80px;
    font-family:'Ma Shan Zheng', serif;
    font-size:18px;
    color:rgba(160,190,220,0.35);
    letter-spacing:0.2em;
  }

  /* ===== 标签 ===== */
  .labels-row {
    display:flex;
    width:2100px;
    color:#888;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:8px;
  }
  .labels-row .fl { margin-left:540px; }
  .labels-row .bl { margin-left:760px; }
</style>
</head>
<body>

<div class="labels-row">
  <span class="fl">正面 · 3:4</span>
  <span class="bl">背面 · 9:16</span>
</div>

<div class="continuous-canvas">

  <!-- 天空背景 -->
  <div class="sky"></div>
  <div class="stars-layer"></div>

  <!-- 云雾 -->
  <div class="clouds-layer">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
    <div class="cloud cloud-6"></div>
    <div class="cloud cloud-7"></div>
  </div>

  <!-- 月亮 -->
  <div class="moon-container">
    <div class="moon-glow-outer"></div>
    <div class="moon-glow-inner"></div>
    <div class="moon-body"></div>
    <div class="moon-crater-1"></div>
    <div class="moon-crater-2"></div>
    <div class="moon-crater-3"></div>
  </div>

  <!-- 正面右上角：知行合一 -->
  <div class="zhixingheyi">知行合一</div>

  <!-- 正面中心：诗句主体 -->
  <div class="poem-glow"></div>
  <div class="poem-main">
    <div class="line">千江有水千江月</div>
    <div class="line">万里无云万里天</div>
  </div>

  <!-- 诗句间的装饰 -->
  <div class="ornament">
    <span class="diamond"></span>
    <span class="line-sep"></span>
    <span class="diamond"></span>
    <span class="line-sep"></span>
    <span class="diamond"></span>
  </div>

  <!-- 正面左下角 -->
  <div class="corner-note">万境归一</div>

  <!-- 水面（正面+背面延伸） -->
  <div class="water-container">
    <div class="water-base"></div>
    <div class="moon-reflection"></div>
    <div class="moon-reflection-2"></div>
    <div class="water-ripples">
      <div class="ripple" style="bottom:40px;left:5%;width:40%;"></div>
      <div class="ripple" style="bottom:80px;left:15%;width:35%;"></div>
      <div class="ripple" style="bottom:120px;left:0%;width:50%;opacity:0.7;"></div>
      <div class="ripple" style="bottom:60px;left:30%;width:45%;opacity:0.6;"></div>
      <div class="ripple" style="bottom:100px;left:20%;width:30%;opacity:0.5;"></div>
      <div class="ripple" style="bottom:45px;left:50%;width:35%;opacity:0.8;"></div>
      <div class="ripple" style="bottom:150px;left:10%;width:25%;opacity:0.4;"></div>
      <div class="ripple" style="bottom:35px;left:70%;width:30%;opacity:0.6;"></div>
      <div class="ripple" style="bottom:90px;left:60%;width:35%;opacity:0.45;"></div>
      <div class="ripple" style="bottom:130px;left:40%;width:20%;opacity:0.35;"></div>
      <div class="ripple" style="bottom:55px;left:80%;width:25%;opacity:0.5;"></div>
    </div>
  </div>

  <!-- 背面繁星 -->
  <div class="back-stars"></div>

  <!-- 背面云雾 -->
  <div class="cloud-back"></div>

  <!-- 背面水面 -->
  <div class="water-back"></div>
  <div class="water-back-pattern"></div>

  <!-- 背面抽象圆环（呼应月亮意象） -->
  <div class="back-circle-1"></div>
  <div class="back-circle-2"></div>
  <div class="back-circle-3"></div>

  <!-- 背面：莫名其妙（竖排） -->
  <div class="momingqimiao">莫名其妙</div>

  <!-- 背面底部小字 -->
  <div class="back-note">心月同明</div>

  <!-- 正面/背面分界线 -->
  <div class="edge-marker"></div>

</div>

<div style="margin-top:40px;color:#666;font-size:13px;text-align:center;width:2100px;">
  连续画面 · 左(正面3:4) → 右(背面9:16)
</div>

</body>
</html>
