# TITA + MIMXRT1061

CONFIG_FPU=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_PICOLIBC_IO_LONG_LONG=y

CONFIG_UART_ASYNC_API=y
CONFIG_SPI_ASYNC=y

CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BOOT_BANNER=n

CONFIG_FLASH_MAP=y
CONFIG_HWINFO=y

CONFIG_CACHE_MANAGEMENT=y

# CONFIG_MAIN_STACK_SIZE=8192
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_DIABLO_A2_SERIES_LOCOMOTION=y
# CONFIG_DIABLO_STUB_LOCOMOTION=y

CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-fsingle-precision-constant"

# relocal flash to itcm, not real xip
CONFIG_XIP=y
CONFIG_FLASH_MCUX_FLEXSPI_XIP=n
CONFIG_CODE_ITCM=y

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--version 1.0.0+0"

# For ISR naming, I#{number} = IRQ + 16
CONFIG_SEGGER_SYSTEMVIEW_ISR_DESC="I#28=SBUS-DMA,I#41=SBUS-UART6,I#51=IMU-SPI4,I#52=CAN1-R,I#53=CAN2-L,I#101=IMU-UPD,I#129=USB,I#170=CAN3-FD"

CONFIG_USB_CDC_ACM=y
CONFIG_CDC_ACM_IAD=n

CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# For EVK tuning timing
CONFIG_TRACING=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_SEGGER_SYSTEMVIEW=y
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_SYSCALL=n

#For OTA
CONFIG_POSIX_CLOCK=y
CONFIG_APP_ABUP_FOTA=y

#For FSM
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# rollback legacy/diablo a1 attitude filter
CONFIG_DDT_LEGACY_ATTITUDE_ALG=y

# CAN-FD fixed-point format for motor data
CONFIG_DDT_CANFD_USE_FIXED_POINT=y
