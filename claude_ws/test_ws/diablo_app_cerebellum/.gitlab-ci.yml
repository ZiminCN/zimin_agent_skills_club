include:
  - project: 'rbt/privileged/ci_base'
    ref: main
    file: 'pipelines/prepare_common.yml'

default:
  image: registry.cn-hangzhou.aliyuncs.com/ddt_robot/zephyr:latest

stages:
  - zephyr_check

build_evk_check:
  stage: zephyr_check
  script:
    - . ci_base/scripts/zephyr_check.sh rbt/mcu/diablo_cerebellum.git dev diablo_apollo_evk directdrivetech/applications/cerebellum

build_apollo_check:
  stage: zephyr_check
  script:
    - . ci_base/scripts/zephyr_check.sh rbt/mcu/diablo_cerebellum.git dev diablo_apollo directdrivetech/applications/cerebellum

